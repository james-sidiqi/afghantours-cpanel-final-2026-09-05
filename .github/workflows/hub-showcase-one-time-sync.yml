name: One-time hub staging build
on:
  push:
    branches: [fix/hub-experience-showcase-20261119]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Synchronize dist, remove temporary helper and push
        run: |
          set -e
          git add -f dist/
          git rm .github/workflows/hub-showcase-one-time-sync.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build hub showcase and retire temporary workflow'
          git push origin HEAD:refs/heads/fix/hub-experience-showcase-20261119
      - name: Package staging overlay
        run: |
          set -e
          SHA=$(git rev-parse HEAD)
          SHORT=$(echo "$SHA" | cut -c1-8)
          ID=at-20261119-$SHORT
          mkdir -p release
          python3 scripts/release/package.py build --dist dist --out release --commit "$SHA" --release-id "$ID" --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/release/package.py verify release/$ID-full.zip release/manifest.json
          cp release/$ID-full.zip release/$ID-STAGING-UPLOAD.zip
          zip -d release/$ID-STAGING-UPLOAD.zip robots.txt
          sha256sum release/$ID-STAGING-UPLOAD.zip > release/STAGING-UPLOAD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: afghantours-hub-staging-candidate
          path: |
            release/*STAGING-UPLOAD.zip
            release/STAGING-UPLOAD-SHA256.txt
          retention-days: 14
