name: One-time Nov 23 visual review dist build
on:
  push:
    branches:
      - fix/nov23-staging-visual-qa-20261124

permissions:
  contents: write

jobs:
  regenerate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild static files from source
        run: npm run build
      - name: Commit generated site and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git add -f dist/
          git rm .github/workflows/nov23-visual-qa-one-time-build.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build Nov23 visual QA pages and retire one-time helper'
          git push origin HEAD:refs/heads/fix/nov23-staging-visual-qa-20261124
